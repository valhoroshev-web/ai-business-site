name: Check Next.js

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate use-case catalog
        run: node scripts/check-catalog.mjs
      - name: Build
        run: npm run build
      - name: Smoke-test contact channels and CAPTCHA (synthetic data)
        run: node scripts/smoke-contacts.mjs
